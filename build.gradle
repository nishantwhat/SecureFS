plugins {
    id 'java'
    id 'application'
}

group = 'com.securefs'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.securefs.cli.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.securefs.cli.Main'
    }
    // Build a fat JAR containing all dependencies.
    // SecureFS uses only the Java standard library,
    // so this JAR has no external dependencies to bundle.
    from configurations.runtimeClasspath.collect {
        it.isDirectory() ? it : zipTree(it)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'securefs.jar'
}

test {
    useJUnitPlatform()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}